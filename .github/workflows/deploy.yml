name: Deploy

# Runs on the self-hosted runner inside the Intake LXC container (label "intake"), only after CI
# passed on a push to main. The runner user may run exactly /opt/intake/deploy.sh as root through
# a sudoers rule; see docs/deployment.md, "Automatic deploy".
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: [self-hosted, intake]
    timeout-minutes: 20
    steps:
      - name: Deploy with deploy.sh
        run: sudo -n /usr/bin/bash /opt/intake/deploy.sh
