<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Aggiungi</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#17201B;text-decoration:none}a:hover{color:#2F6B47}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #8B918C; font-family: 'Manrope', system-ui, sans-serif; color: #17201B; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden">
<div role="dialog" aria-label="Aggiungi" style="max-height: 92%; overflow-y: auto; box-sizing: border-box; padding: 10px 16px 30px; background: #F4F5F1; border-radius: 28px 28px 0 0; display: flex; flex-direction: column; gap: 12px">
<div style="width: 40px; height: 5px; border-radius: 3px; background: #C9CEC6; align-self: center"></div>
<div style="display: flex; justify-content: space-between; align-items: center; padding: 4px 4px 0">
<span style="font-size: 22px; font-weight: 800">Aggiungi</span>
<a href="Main.dc.html" aria-label="Chiudi" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#17201B" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<button style="height: 52px; border-radius: 16px; border: none; background: #E4EEF7; color: #1F5A90; font-family: inherit; font-size: 15px; font-weight: 800">Acqua + 250 ml</button>
<button style="height: 52px; border-radius: 16px; border: none; background: #E4EEF7; color: #1F5A90; font-family: inherit; font-size: 15px; font-weight: 800">Acqua + 500 ml</button>
</div>

<span style="font-size: 12px; font-weight: 800; color: #56605A; letter-spacing: 0.05em; padding: 4px 4px 0">DAL PIANO DI OGGI</span>
<div style="padding: 0 16px; background: #FFFFFF; border-radius: 20px">
<button style="width: 100%; min-height: 56px; border: none; border-bottom: 1px solid #ECEEEA; background: none; font-family: inherit; display: flex; justify-content: space-between; align-items: center; gap: 8px; text-align: left; padding: 0"><span style="display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 800; color: #17201B">Spuntino · 11:00</span><span style="font-size: 13px; color: #56605A">1 frutto + mandorle 25 g</span></span><span style="font-size: 13px; font-weight: 800; color: #2F6B47">Registra</span></button>
<button style="width: 100%; min-height: 56px; border: none; background: none; font-family: inherit; display: flex; justify-content: space-between; align-items: center; gap: 8px; text-align: left; padding: 0"><span style="display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 800; color: #17201B">Pranzo · 13:00</span><span style="font-size: 13px; color: #56605A">Insalata di farro con tonno, ceci e mozzarella</span></span><span style="font-size: 13px; font-weight: 800; color: #2F6B47">Registra</span></button>
</div>

<span style="font-size: 12px; font-weight: 800; color: #56605A; letter-spacing: 0.05em; padding: 4px 4px 0">ALTRO CIBO</span>
<div style="padding: 0 16px; background: #FFFFFF; border-radius: 20px">
<sc-for list="{{options}}" as="o" hint-placeholder-count="4">
<button style="width: 100%; min-height: 60px; border: none; border-bottom: 1px solid #ECEEEA; background: none; font-family: inherit; display: flex; align-items: center; gap: 12px; text-align: left; padding: 0">
<span style="width: 36px; height: 36px; flex: none; border-radius: 12px; background: #E3F0E6; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2F6B47" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{o.icon}}"></path></svg></span>
<span style="display: flex; flex-direction: column; flex: 1"><span style="font-size: 15px; font-weight: 800; color: #17201B">{{o.title}}</span><span style="font-size: 13px; color: #56605A">{{o.sub}}</span></span>
</button>
</sc-for>
</div>

<span style="font-size: 12px; line-height: 1.5; color: #56605A; padding: 0 4px">Per foto del piatto o descrizioni libere ("ho mangiato una pizza margherita") continua a usare Claude: registra direttamente su Nutrition.</span>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      options: [
        { title: 'Ripeti un pasto recente', sub: 'Es. pranzo di ieri: pasta di farro al ragù · 552 kcal', icon: 'M4 12a8 8 0 1 0 3-6.2M4 4v5h5' },
        { title: 'Pasti salvati', sub: 'I tuoi preferiti su Nutrition, con un tocco', icon: 'M12 17l-5 3 1-6-4-4 6-1 2-5 2 5 6 1-4 4 1 6z' },
        { title: 'Cerca alimento', sub: 'Dal database Nutrition, scegli la quantità', icon: 'M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM20 20l-4-4' },
        { title: 'Scansiona codice a barre', sub: 'Con la fotocamera, legge l’etichetta', icon: 'M4 6v12M8 6v12M11 6v12M15 6v12M18 6v12M20 6v12' }
      ]
    };
  }
}
</script>
</body>
</html>
