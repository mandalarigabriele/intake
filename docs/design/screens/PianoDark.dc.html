<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Piano – dark</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#EEF1EC;text-decoration:none}a:hover{color:#5FB083}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #121412; font-family: 'Manrope', system-ui, sans-serif; color: #EEF1EC; display: flex; flex-direction: column; overflow: hidden; position: relative">

<header style="padding: 52px 20px 10px; display: flex; justify-content: space-between; align-items: flex-end">
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 13px; font-weight: 600; color: #A3ABA4">Attivo dall'8 nov · 2.200 kcal · 135 g prot.</span><h1 style="margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -0.02em">Piano</h1></div>
<button onClick="{{toggleMenu}}" aria-label="Gestisci piano" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: #1C1F1C; display: flex; align-items: center; justify-content: center; color: #EEF1EC"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2"></circle><circle cx="12" cy="12" r="2"></circle><circle cx="19" cy="12" r="2"></circle></svg></button>
</header>

<div role="tablist" aria-label="Giorni" style="padding: 4px 16px 12px; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="7">
<sc-if value="{{t.sel}}" hint-placeholder-val="{{false}}">
<button role="tab" aria-selected="true" style="height: 52px; border-radius: 14px; border: none; background: #5FB083; color: #0F1A13; font-family: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px"><span style="font-size: 15px; font-weight: 800">{{t.l}}</span><span style="font-size: 10px; font-weight: 700">{{t.tag}}</span></button>
</sc-if>
<sc-if value="{{t.unsel}}" hint-placeholder-val="{{true}}">
<button role="tab" onClick="{{t.pick}}" style="height: 52px; border-radius: 14px; border: 1px solid #343832; background: #1C1F1C; color: #EEF1EC; font-family: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px"><span style="font-size: 15px; font-weight: 700">{{t.l}}</span><span style="font-size: 10px; font-weight: 700; color: #A3ABA4">{{t.tag}}</span></button>
</sc-if>
</sc-for>
</div>

<div style="flex: 1; min-height: 0; overflow-y: auto; padding: 0 16px 20px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: baseline; padding: 2px 4px">
<span style="font-size: 20px; font-weight: 800">{{dayName}}</span>
<span style="font-size: 13px; font-weight: 600; color: #A3ABA4">{{dayNote}}</span>
</div>

<sc-for list="{{meals}}" as="m" hint-placeholder-count="5">
<sc-if value="{{m.free}}" hint-placeholder-val="{{false}}">
<div style="padding: 16px 18px; border-radius: 20px; background: #1F3628; display: flex; justify-content: space-between; align-items: center">
<span style="font-size: 15px; font-weight: 800">{{m.title}}</span>
<span style="font-size: 12px; font-weight: 800; color: #A8DDBC; background: #1C1F1C; padding: 4px 10px; border-radius: 999px">LIBERO</span>
</div>
</sc-if>
<sc-if value="{{m.fixed}}" hint-placeholder-val="{{true}}">
<div style="padding: 14px 18px; border-radius: 20px; background: #1C1F1C; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; align-items: center"><span style="font-size: 15px; font-weight: 800">{{m.title}}</span><span style="font-size: 12px; font-weight: 700; color: #A3ABA4">{{m.time}}</span></div>
<div style="display: flex; flex-direction: column; gap: 4px">
<sc-for list="{{m.lines}}" as="ln" hint-placeholder-count="2"><div style="display: flex; gap: 8px; align-items: baseline"><span style="width: 5px; height: 5px; flex: none; border-radius: 3px; background: #6B736C; transform: translateY(-2px)"></span><span style="font-size: 14px; line-height: 1.45; color: #C9D0CA">{{ln.t}}</span></div></sc-for>
</div>
</div>
</sc-if>
</sc-for>
</div>

<sc-if value="{{menu}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; inset: 0; background: rgba(23, 32, 27, 0.35); display: flex; justify-content: flex-end; align-items: flex-start; padding: 100px 16px 0">
<div role="menu" aria-label="Gestisci piano" style="width: 270px; padding: 6px; background: #1C1F1C; border-radius: 18px; box-shadow: 0 10px 30px rgba(23, 32, 27, 0.2); display: flex; flex-direction: column">
<button role="menuitem" style="min-height: 48px; padding: 0 12px; border: none; background: none; border-radius: 12px; font-family: inherit; text-align: left; display: flex; flex-direction: column; justify-content: center"><span style="font-size: 15px; font-weight: 800; color: #EEF1EC">Carica nuovo piano</span><span style="font-size: 12px; color: #A3ABA4">File .json generato da Claude</span></button>
<button role="menuitem" style="min-height: 48px; padding: 0 12px; border: none; background: none; border-radius: 12px; font-family: inherit; text-align: left; display: flex; flex-direction: column; justify-content: center"><span style="font-size: 15px; font-weight: 800; color: #EEF1EC">Storico versioni</span><span style="font-size: 12px; color: #A3ABA4">2 piani · in uso dall'8 nov 2026</span></button>
<button role="menuitem" onClick="{{toggleMenu}}" style="min-height: 44px; padding: 0 12px; border: none; background: none; border-radius: 12px; font-family: inherit; text-align: left; font-size: 14px; font-weight: 700; color: #A3ABA4">Chiudi</button>
</div>
</div>
</sc-if>

<div style="flex: none; padding: 10px 8px 26px; background: #1C1F1C; border-top: 1px solid #2B2E2A; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center">
<a href="OggiDark.dc.html" aria-label="Oggi" style="height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #A3ABA4"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><path d="M12 8v4l3 2"></path></svg><span style="font-size: 11px; font-weight: 700">Oggi</span></a>
<a href="Settimana.dc.html" aria-label="Andamento" style="height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #A3ABA4"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20V10M12 20V4M19 20v-7"></path></svg><span style="font-size: 11px; font-weight: 700">Andamento</span></a>
<a href="Aggiungi.dc.html" aria-label="Aggiungi" style="width: 52px; height: 52px; justify-self: center; border-radius: 26px; background: #EEF1EC; color: #0F1A13; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></a>
<a href="PianoDark.dc.html" aria-label="Piano" aria-current="page" style="height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #5FB083"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"></rect><path d="M9 9h6M9 13h6M9 17h3"></path></svg><span style="font-size: 11px; font-weight: 800">Piano</span></a>
<a href="Timeline.dc.html" aria-label="Timeline" style="height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #A3ABA4"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3v18"></path><circle cx="7" cy="7" r="2"></circle><circle cx="7" cy="17" r="2"></circle><path d="M12 7h8M12 17h8"></path></svg><span style="font-size: 11px; font-weight: 700">Timeline</span></a>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { day: 4, menu: false }; }
  renderVals() {
    const F = (title, time, lines) => ({ title: title, time: time, lines: lines.map((t) => ({ t: t })), free: false, fixed: true });
    const L = (title) => ({ title: title, free: true, fixed: false, time: '', lines: [] });
    const week = [
      { name: "Lunedì", l: "L", tag: "130 g", note: "~130 g proteine", meals: [
        F("Colazione", "07:44", ["Caffellatte", "yogurt greco 150 g con muesli 40 g e banana"]),
        F("Spuntino", "11:00", ["1 frutto", "25 g di mandorle"]),
        F("Pranzo", "13:00", ["Pasta 120 g al pomodoro con tonno al naturale 70 g", "insalata"]),
        F("Spuntino", "16:00", ["1 fetta di pane integrale con 2 quadratini di cioccolato fondente", "15 g di noci"]),
        F("Cena", "20:00", ["Pollo alla piastra 220 g", "verdure", "pane integrale 80 g", "1 frutto"])] },
      { name: "Martedì", l: "M", tag: "130 g", note: "~130 g proteine", meals: [
        F("Colazione", "07:44", ["Caffellatte", "2 uova strapazzate", "2 fette di pane integrale"]),
        F("Spuntino", "11:00", ["Yogurt greco 150 g con 1 frutto a pezzetti"]),
        F("Pranzo", "13:00", ["Piadina integrale con bresaola 70 g, stracchino 30 g e rucola", "verdure", "1 frutto"]),
        F("Spuntino", "16:00", ["1 frutto", "10 g di mandorle"]),
        F("Cena", "20:00", ["Salmone 180 g", "insalata", "patate al forno 250 g"])] },
      { name: "Mercoledì", l: "M", tag: "110 g", note: "~110 g proteine", meals: [
        F("Colazione", "07:44", ["Caffellatte", "2 fette di pane integrale con ricotta 100 g e marmellata"]),
        F("Spuntino", "11:00", ["1 frutto", "20 g di mandorle"]),
        F("Pranzo", "13:00", ["Pasta 100 g con fagioli cotti 150 g", "verdure", "1 frutto"]),
        F("Spuntino", "16:00", ["Yogurt greco 150 g con 1 frutto a pezzetti"]),
        F("Cena", "20:00", ["Frittata con 4 uova, 20 g di parmigiano e 250 g di verdure", "2 fette di pane integrale"])] },
      { name: "Giovedì", l: "G", tag: "145 g", note: "~145 g proteine", meals: [
        F("Colazione", "07:44", ["Caffellatte", "yogurt greco 150 g con fiocchi d'avena 40 g, miele e banana"]),
        F("Spuntino", "11:00", ["1 frutto", "15 g di noci"]),
        F("Pranzo", "13:00", ["Pasta 100 g al ragù magro di manzo 120 g", "insalata"]),
        F("Spuntino", "16:00", ["1 fetta di pane integrale con fesa di tacchino 50 g", "1 frutto"]),
        F("Cena", "20:00", ["Merluzzo o orata 250 g con piselli 200 g", "verdure", "1 fetta di pane integrale"])] },
      { name: "Venerdì", l: "V", tag: "oggi", note: "~130 g proteine", meals: [
        F("Colazione", "07:44", ["Caffellatte", "2 uova strapazzate", "2 fette di pane integrale", "1 frutto"]),
        F("Spuntino", "11:00", ["Yogurt greco 150 g", "1 frutto"]),
        F("Pranzo", "13:00", ["Insalata di farro 90 g con ceci 150 g, pomodorini, rucola e verdure grigliate"]),
        F("Spuntino", "16:00", ["1 frutto", "20 g di mandorle"]),
        F("Cena", "20:00", ["Pollo 220 g", "patate al forno 250 g", "verdure"])] },
      { name: "Sabato", l: "S", tag: "libero", note: "pranzo in famiglia · cena libera", meals: [
        F("Colazione", "07:44", ["Caffellatte", "yogurt greco 150 g con fiocchi d'avena 40 g e banana"]),
        F("Spuntino", "11:00", ["1 frutto", "20 g di mandorle"]),
        F("Pranzo in famiglia", "13:00", ["A scelta, adatto anche al bimbo", "Regola del piatto: metà verdure, un quarto proteine, un quarto pasta, pane o patate"]),
        F("Spuntino", "16:00", ["1 frutto", "15 g di noci"]),
        L("Cena")] },
      { name: "Domenica", l: "D", tag: "libero", note: "pranzo libero", meals: [
        F("Colazione", "07:44", ["Caffellatte", "2 fette di pane integrale con ricotta 100 g e marmellata"]),
        F("Spuntino", "11:00", ["1 frutto"]),
        L("Pranzo"),
        F("Spuntino", "16:00", ["Yogurt greco 150 g con 1 frutto a pezzetti e 15 g di noci"]),
        F("Cena veloce", "20:00", ["Piadina integrale con fettine di tacchino 120 g, rucola e pomodorini", "insalata"])] }
    ];
    const d = week[this.state.day];
    return {
      tabs: week.map((w, i) => ({ l: w.l, tag: w.tag, sel: i === this.state.day, unsel: i !== this.state.day, pick: () => this.setState({ day: i }) })),
      dayName: d.name,
      dayNote: d.note,
      meals: d.meals,
      menu: this.state.menu,
      toggleMenu: () => this.setState({ menu: !this.state.menu })
    };
  }
}
</script>
</body>
</html>
