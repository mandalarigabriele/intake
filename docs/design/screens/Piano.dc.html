<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Piano alimentare</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#17201B;text-decoration:none}a:hover{color:#2F6B47}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F5F1; font-family: 'Manrope', system-ui, sans-serif; color: #17201B; display: flex; flex-direction: column; overflow: hidden; position: relative">

<header style="padding: 52px 20px 10px; display: flex; justify-content: space-between; align-items: flex-end">
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 13px; font-weight: 600; color: #56605A">Attivo dal 4 nov · 2.200 kcal · 135 g prot.</span><h1 style="margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -0.02em">Piano</h1></div>
<button onClick="{{toggleMenu}}" aria-label="Gestisci piano" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: #FFFFFF; display: flex; align-items: center; justify-content: center; color: #17201B"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2"></circle><circle cx="12" cy="12" r="2"></circle><circle cx="19" cy="12" r="2"></circle></svg></button>
</header>

<div role="tablist" aria-label="Giorni" style="padding: 4px 16px 12px; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="7">
<sc-if value="{{t.sel}}" hint-placeholder-val="{{false}}">
<button role="tab" aria-selected="true" style="height: 52px; border-radius: 14px; border: none; background: #2F6B47; color: #FFFFFF; font-family: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px"><span style="font-size: 15px; font-weight: 800">{{t.l}}</span><span style="font-size: 10px; font-weight: 700">{{t.tag}}</span></button>
</sc-if>
<sc-if value="{{t.unsel}}" hint-placeholder-val="{{true}}">
<button role="tab" onClick="{{t.pick}}" style="height: 52px; border-radius: 14px; border: 1px solid #DDE1DA; background: #FFFFFF; color: #17201B; font-family: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px"><span style="font-size: 15px; font-weight: 700">{{t.l}}</span><span style="font-size: 10px; font-weight: 700; color: #56605A">{{t.tag}}</span></button>
</sc-if>
</sc-for>
</div>

<div style="flex: 1; min-height: 0; overflow-y: auto; padding: 0 16px 20px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: baseline; padding: 2px 4px">
<span style="font-size: 20px; font-weight: 800">{{dayName}}</span>
<span style="font-size: 13px; font-weight: 600; color: #56605A">{{dayNote}}</span>
</div>

<sc-for list="{{meals}}" as="m" hint-placeholder-count="5">
<sc-if value="{{m.free}}" hint-placeholder-val="{{false}}">
<div style="padding: 16px 18px; border-radius: 20px; background: #E3F0E6; display: flex; justify-content: space-between; align-items: center">
<span style="font-size: 15px; font-weight: 800">{{m.title}}</span>
<span style="font-size: 12px; font-weight: 800; color: #1F4D33; background: #FFFFFF; padding: 4px 10px; border-radius: 999px">LIBERO</span>
</div>
</sc-if>
<sc-if value="{{m.fixed}}" hint-placeholder-val="{{true}}">
<div style="padding: 14px 18px; border-radius: 20px; background: #FFFFFF; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; align-items: center"><span style="font-size: 15px; font-weight: 800">{{m.title}}</span><span style="font-size: 12px; font-weight: 700; color: #56605A">{{m.time}}</span></div>
<div style="display: flex; flex-direction: column; gap: 4px">
<sc-for list="{{m.lines}}" as="ln" hint-placeholder-count="2"><div style="display: flex; gap: 8px; align-items: baseline"><span style="width: 5px; height: 5px; flex: none; border-radius: 3px; background: #9AA39C; transform: translateY(-2px)"></span><span style="font-size: 14px; line-height: 1.45; color: #3C453F">{{ln.t}}</span></div></sc-for>
</div>
</div>
</sc-if>
</sc-for>
</div>

<sc-if value="{{menu}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; inset: 0; background: rgba(23, 32, 27, 0.35); display: flex; justify-content: flex-end; align-items: flex-start; padding: 100px 16px 0">
<div role="menu" aria-label="Gestisci piano" style="width: 270px; padding: 6px; background: #FFFFFF; border-radius: 18px; box-shadow: 0 10px 30px rgba(23, 32, 27, 0.2); display: flex; flex-direction: column">
<button role="menuitem" style="min-height: 48px; padding: 0 12px; border: none; background: none; border-radius: 12px; font-family: inherit; text-align: left; display: flex; flex-direction: column; justify-content: center"><span style="font-size: 15px; font-weight: 800; color: #17201B">Carica nuovo piano</span><span style="font-size: 12px; color: #56605A">File .json generato da Claude</span></button>
<button role="menuitem" style="min-height: 48px; padding: 0 12px; border: none; background: none; border-radius: 12px; font-family: inherit; text-align: left; display: flex; flex-direction: column; justify-content: center"><span style="font-size: 15px; font-weight: 800; color: #17201B">Storico versioni</span><span style="font-size: 12px; color: #56605A">1 piano · in uso dal 4 nov 2026</span></button>
<button role="menuitem" onClick="{{toggleMenu}}" style="min-height: 44px; padding: 0 12px; border: none; background: none; border-radius: 12px; font-family: inherit; text-align: left; font-size: 14px; font-weight: 700; color: #56605A">Chiudi</button>
</div>
</div>
</sc-if>

<div style="flex: none; padding: 10px 12px 26px; background: #FFFFFF; border-top: 1px solid #E2E5DF; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); align-items: center">
<a href="Main.dc.html" aria-label="Oggi" style="height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #56605A"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><path d="M12 8v4l3 2"></path></svg><span style="font-size: 11px; font-weight: 700">Oggi</span></a>
<a href="Settimana.dc.html" aria-label="Settimana" style="height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #56605A"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20V10M12 20V4M19 20v-7"></path></svg><span style="font-size: 11px; font-weight: 700">Settimana</span></a>
<a href="Piano.dc.html" aria-label="Piano" aria-current="page" style="height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #2F6B47"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"></rect><path d="M9 9h6M9 13h6M9 17h3"></path></svg><span style="font-size: 11px; font-weight: 800">Piano</span></a>
<a href="Allenamenti.dc.html" aria-label="Allenamenti" style="height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #56605A"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"></path></svg><span style="font-size: 11px; font-weight: 700">Allenamenti</span></a>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { day: 3, menu: false }; }
  renderVals() {
    const F = (title, time, lines) => ({ title: title, time: time, lines: lines.map((t) => ({ t: t })), free: false, fixed: true });
    const L = (title) => ({ title: title, free: true, fixed: false, time: '', lines: [] });
    const week = [
      { name: 'Lunedì', l: 'L', tag: '135 g', note: '~135 g proteine', meals: [
        F('Colazione', '', ['Caffellatte', 'Yogurt greco 150 g con muesli 40 g e banana']),
        F('Spuntino', '11:00', ['1 frutto', 'Mandorle 25 g']),
        F('Pranzo', '', ['Pasta 120 g al pomodoro', 'Tonno al naturale 100 g', 'Insalata']),
        F('Spuntino', '16:00', ['Pane integrale 40 g con bresaola 40 g', '2 quadratini di cioccolato fondente']),
        F('Cena', '', ['Frittata con 4 uova e verdure 250 g', 'Pane integrale 2 fette'])] },
      { name: 'Martedì', l: 'M', tag: '135 g', note: '~135 g proteine', meals: [
        F('Colazione', '', ['Caffellatte', '2 uova strapazzate', 'Pane integrale 2 fette']),
        F('Spuntino', '11:00', ['Yogurt greco 150 g con 1 frutto a pezzetti']),
        F('Pranzo', '', ['Pasta 80 g con fagioli cotti 250 g', 'Parmigiano 15 g', 'Verdure']),
        F('Spuntino', '16:00', ['1 frutto', 'Bresaola 60 g', 'Noci 15 g']),
        F('Cena', '', ['Salmone al forno 200 g', 'Patate al forno 250 g', 'Insalata'])] },
      { name: 'Mercoledì', l: 'M', tag: 'dolce', note: 'spuntino dolce', meals: [
        F('Colazione', '', ['Caffellatte', 'Pane integrale 2 fette con ricotta 100 g e marmellata']),
        F('Spuntino', '11:00', ['1 frutto', 'Fesa di tacchino 80 g']),
        F('Pranzo', '', ['Piadina integrale con bresaola 100 g, stracchino 40 g e rucola', 'Verdure', '1 frutto']),
        F('Spuntino dolce', '16:00', ['Yogurt greco 150 g con 2 biscotti o 1 cucchiaino di crema di nocciole']),
        F('Cena', '', ['Lonza di maiale ai ferri 200 g', 'Verdure', 'Pane integrale 100 g', '1 frutto'])] },
      { name: 'Giovedì', l: 'G', tag: 'oggi', note: '~130 g proteine', meals: [
        F('Colazione', '', ['Caffellatte', "Yogurt greco 150 g con avena 40 g, miele e banana"]),
        F('Spuntino', '11:00', ['1 frutto', 'Bresaola 40 g']),
        F('Pranzo', '', ['Pasta 100 g al ragù magro di manzo 120 g', 'Insalata']),
        F('Spuntino', '16:00', ['1 frutto', 'Mandorle 25 g']),
        F('Cena', '', ['Merluzzo o orata al forno 250 g', 'Patate al forno 250 g', 'Verdure', 'Pane integrale 1 fetta'])] },
      { name: 'Venerdì', l: 'V', tag: '135 g', note: '~135 g proteine', meals: [
        F('Colazione', '', ['Caffellatte', '2 uova strapazzate', 'Pane integrale 2 fette', '1 frutto']),
        F('Spuntino', '11:00', ['1 frutto', 'Mandorle 25 g']),
        F('Pranzo', '', ['Insalata di farro 70 g con tonno 100 g, ceci 100 g, mozzarella 60 g e verdure']),
        F('Spuntino', '16:00', ['Fesa di tacchino 50 g', 'Pane integrale 1 fetta']),
        F('Cena', '', ['Straccetti di pollo o tacchino al limone 180 g', 'Patate al forno 250 g', 'Verdure'])] },
      { name: 'Sabato', l: 'S', tag: 'libero', note: 'pranzo in famiglia · cena libera', meals: [
        F('Colazione', '', ['Caffellatte', '3 uova strapazzate', 'Pane integrale 2 fette']),
        F('Spuntino', '11:00', ['Yogurt greco 150 g', '1 frutto']),
        F('Pranzo in famiglia', '', ['Hamburger di manzo magro 150 g, patate al forno 250 g e verdure', 'oppure pasta 100 g al pomodoro con polpette al forno 150 g']),
        F('Spuntino', '16:00', ['1 frutto', 'Bresaola 40 g']),
        L('Cena')] },
      { name: 'Domenica', l: 'D', tag: 'libero', note: 'pranzo libero', meals: [
        F('Colazione', '', ['Caffellatte', 'Yogurt greco 150 g con muesli 40 g e banana']),
        F('Spuntino', '11:00', ['1 frutto', 'Noci 20 g']),
        L('Pranzo'),
        F('Spuntino', '16:00', ['Yogurt greco 150 g', 'Noci 20 g']),
        F('Cena', '', ['Polpette di tacchino al forno 200 g', 'Patate al forno 250 g', 'Insalata mista'])] }
    ];
    const d = week[this.state.day];
    return {
      tabs: week.map((w, i) => ({ l: w.l, tag: w.tag, sel: i === this.state.day, unsel: i !== this.state.day, pick: () => this.setState({ day: i }) })),
      dayName: d.name,
      dayNote: d.note,
      meals: d.meals,
      menu: this.state.menu,
      toggleMenu: () => this.setState({ menu: !this.state.menu })
    };
  }
}
</script>
</body>
</html>
