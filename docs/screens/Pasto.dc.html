<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Dettaglio colazione</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#17201B;text-decoration:none}a:hover{color:#2F6B47}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F5F1; font-family: 'Manrope', system-ui, sans-serif; color: #17201B; display: flex; flex-direction: column; overflow: hidden">

<header style="padding: 52px 16px 8px; display: flex; align-items: center; gap: 8px">
<a href="Main.dc.html" aria-label="Torna a Oggi" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#17201B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
<span style="font-size: 14px; font-weight: 700; color: #56605A">Venerdì · 08:05</span>
</header>

<section style="padding: 8px 20px 18px; display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -0.02em">Colazione</h1>
<span style="font-size: 44px; font-weight: 800; letter-spacing: -0.03em; font-variant-numeric: tabular-nums">419 <span style="font-size: 18px; font-weight: 700; color: #56605A">kcal</span></span>
<span style="font-size: 13px; font-weight: 600; color: #56605A">19% delle 2.200 kcal di oggi</span>
</section>

<section aria-label="Ripartizione macro" style="margin: 0 16px; padding: 18px 20px; background: #FFFFFF; border-radius: 24px; display: flex; flex-direction: column; gap: 14px">
<div style="height: 14px; border-radius: 7px; overflow: hidden; display: flex; gap: 3px">
<div style="width: 25%; background: #0A8FA6"></div>
<div style="width: 61%; background: #C98A1B"></div>
<div style="width: 14%; background: #8A5A9E"></div>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; font-weight: 700; color: #1B5A62">Proteine</span><span style="font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums">26,7 g</span><span style="font-size: 12px; font-weight: 600; color: #56605A">20% obiettivo</span></div>
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; font-weight: 700; color: #7A5410">Carboidrati</span><span style="font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums">65,2 g</span><span style="font-size: 12px; font-weight: 600; color: #56605A">26% obiettivo</span></div>
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; font-weight: 700; color: #66407A">Grassi</span><span style="font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums">6,6 g</span><span style="font-size: 12px; font-weight: 600; color: #56605A">9% obiettivo</span></div>
</div>
</section>

<section aria-label="Alimenti" style="margin: 12px 16px 0; padding: 6px 20px; background: #FFFFFF; border-radius: 24px; display: flex; flex-direction: column">
<sc-for list="{{items}}" as="it" hint-placeholder-count="4">
<div style="display: flex; justify-content: space-between; align-items: center; padding: 13px 0; border-bottom: 1px solid #ECEEEA">
<span style="font-size: 15px; font-weight: 700">{{it.name}}</span>
<span style="font-size: 14px; font-weight: 600; color: #56605A">{{it.qty}}</span>
</div>
</sc-for>
</section>

<section aria-label="Altri valori" style="margin: 12px 16px 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<div style="padding: 14px; background: #FFFFFF; border-radius: 18px; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; font-weight: 600; color: #56605A">Fibre</span><span style="font-size: 18px; font-weight: 800">6,6 g</span></div>
<div style="padding: 14px; background: #FFFFFF; border-radius: 18px; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; font-weight: 600; color: #56605A">Zuccheri</span><span style="font-size: 18px; font-weight: 800">28,2 g</span><span style="font-size: 11px; font-weight: 600; color: #2F6B47">0 g aggiunti</span></div>
<div style="padding: 14px; background: #FFFFFF; border-radius: 18px; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; font-weight: 600; color: #56605A">Caffeina</span><span style="font-size: 18px; font-weight: 800">63 mg</span></div>
</section>

<div style="flex: 1"></div>

<div style="padding: 0 16px 30px; display: flex; gap: 10px">
<a href="Modifica.dc.html" style="flex: 1; height: 52px; box-sizing: border-box; border-radius: 16px; border: 1px solid #C3C9C0; background: #FFFFFF; color: #17201B; font-weight: 800; font-size: 15px; display: flex; align-items: center; justify-content: center">Modifica</a>
<button style="flex: 1.4; height: 52px; border-radius: 16px; border: none; background: #17201B; color: #FFFFFF; font-family: inherit; font-weight: 800; font-size: 15px">Salva come preferito</button>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      items: [
        { name: 'Caffellatte', qty: '200 ml latte p.s. + caffè' },
        { name: 'Yogurt greco 0%', qty: '150 g' },
        { name: "Fiocchi d'avena", qty: '40 g' },
        { name: 'Banana', qty: '1' }
      ]
    };
  }
}
</script>
</body>
</html>
